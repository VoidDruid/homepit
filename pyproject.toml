[project]
name = "cockpit-service"
version = "0.1.0"
description = "Game-independent cockpit service with an X4 adapter and Launchpad MK2 panel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.5.1",
    "mido>=1.3.3,<2",
    "python-rtmidi==1.5.8",
    "pywin32>=308,<400; sys_platform == 'win32'",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "lupa>=2.8,<3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".python", "build", "data", "external", "libs", "notebooks", "out"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "PD",  # pandas-vet
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E741",  # mathematical variables intentionally follow paper notation (I, l)
]

[tool.ruff.lint.per-file-ignores]

[tool.isort]
known_first_party = []

[tool.black]
line-length = 100
target-version = ['py312']

[tool.coverage.run]
parallel = true
source = [
    "cockpit"
]
context = '${CONTEXT}'
omit = []

[tool.mypy]
strict = true
plugins = ["numpy.typing.mypy_plugin"]
ignore_missing_imports = true
warn_return_any = false
disallow_any_generics = false
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
xfail_strict = true
junit_family = "xunit2"
filterwarnings = [
]
